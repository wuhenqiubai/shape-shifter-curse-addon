plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "ssc-addon.refmap.json"
    }
}

repositories {
    mavenLocal()
    // Aliyun
    maven { url 'https://maven.aliyun.com/nexus/content/groups/public' }
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }

    // GeckoLib（主包 PR #488 已从 AzureLib 迁移到 GeckoLib，附属随之对齐）
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }

    // KosmX (Player Animations Library)
    maven {
        name "KosmX's maven"
        url 'https://maven.kosmx.dev/'
    }

    // Owo
    maven { url 'https://maven.wispforest.io/releases/' }

    // Modrinth
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    // Forgemaven
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }

    // Others
    maven { url "https://maven.quiltmc.org/repository/release" }
    maven { url "https://maven.ladysnake.org/releases" }
    maven {
        url = "https://maven.cafeteria.dev"
        content { includeGroup "net.adriantodt.fabricmc" }
    }
    maven {
        url = "https://maven.jamieswhiteshirt.com/libs-release"
        content { includeGroup "com.jamieswhiteshirt" }
    }
    maven {
        name = "RedlanceMinecraft"
        url = "https://repo.redlance.org/public"
    }
    maven { url "https://masa.dy.fi/maven" }
    maven { url "https://jitpack.io" }
    maven { url "https://maven.shedaniel.me" }
    maven { url "https://maven.terraformersmc.com" }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Shape Shifter Curse-Unofficial Port
    modImplementation "maven.modrinth:shape-shifter-curse-unofficial-port:1.10.0-dev-hf3+build.24+1.21.1"
    
    // Team Reborn Energy API（TechReborn 等工业模组通用能量 API；3.0.0 适用 MC 1.19.4~1.20.4）
    // JiJ 打包进附属 jar：未安装任何工业模组时也能安全加载，能量转变器仅在检测到相邻能量方块时工作
    include modApi("teamreborn:energy:${project.tb_energy_version}")
    
    // Player Animation Library
    modImplementation "com.zigythebird.playeranim:PlayerAnimationLibFabric:${project.pal_version}"

    // Apoli & Dependencies
    modImplementation "io.github.apace100:Apoli-Legacy:${project.apoli_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"
    modImplementation "dev.emi:trinkets:${project.trinkets_version}"

    // Pehkui（碰撞箱缩放，原版 SSC 已依赖；附属用于幽雾化形碰撞箱缩放，替代 mixin）
    modApi("com.github.Virtuoel:Pehkui:${project.pehkui_version}", {
        exclude group: "net.fabricmc.fabric-api"
    })
    modImplementation ("com.terraformersmc:modmenu:${project.modmenu_version}"){transitive = false}
    
    // Irons Spellbooks (NeoForge) - Using compileOnly for API access
    modCompileOnly "maven.modrinth:irons-spells-n-spellbooks:1.21.1-3.16.3"

    // REI 配方查看器（可选依赖：编译期用 API，运行时未装不崩）
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:16.0.799"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:16.0.799"
    // JEI 配方查看器（可选依赖）
    modCompileOnly "maven.modrinth:jei:19.44.0.413" // Fr 1.21.1 JEI
    // EMI 配方查看器
    modCompileOnly"maven.modrinth:emi:1.1.24+1.21.1+fabric"

    // Iris
    modCompileOnly"maven.modrinth:iris:1.8.8+1.21.1-fabric"
    
    // Config & Components (Usually needed by Apoli/Origins)
    modApi("me.shedaniel.cloth:cloth-config-fabric:${project.clothconfig_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modApi("org.ladysnake.cardinal-components-api:cardinal-components-base:${cca_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modApi("org.ladysnake.cardinal-components-api:cardinal-components-entity:${cca_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    // 忽略Java源码过时警告
    options.deprecation = false
    // 屏蔽所有编译器警告
    options.compilerArgs = ["-Xlint:-deprecation", "-Xlint:-removal"]
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}